<h2 mat-dialog-title>Nuevo puesto de atención</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Nombre del puesto</mat-label>
    <input
      matInput
      [(ngModel)]="nombre"
      (keyup.enter)="onAceptar()"
      maxlength="40"
      autofocus />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancelar()">Cancelar</button>
  <button mat-button color="primary" [disabled]="!nombre.trim()" (click)="onAceptar()">Agregar</button>
</mat-dialog-actions>
